<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- 时空观测员象征图标：光锥 + 沙漏 -->
  <rect width="128" height="128" rx="16" fill="#1a1a2e"/>
  <!-- 光锥三角形 -->
  <polygon points="64,20 20,90 108,90" fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.8"/>
  <line x1="64" y1="90" x2="64" y2="110" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
  <!-- 沙漏核心 -->
  <polygon points="64,55 72,65 64,75 56,65" fill="#ff6600" opacity="0.9"/>
  <!-- 底部时间线 -->
  <line x1="30" y1="105" x2="98" y2="105" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
</svg>
